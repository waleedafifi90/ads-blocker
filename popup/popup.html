<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="hero">
    <img src="../icons/icon-48.png" alt="" width="36" height="36">
    <div>
      <h1>Watch Shield</h1>
      <span id="site" class="site"></span>
    </div>
  </header>

  <label class="toggle">
    <span>الحماية شغّالة على هذا الموقع</span>
    <input type="checkbox" role="switch" id="enabled">
  </label>
  <p id="reload-hint" class="hint" hidden>أعد تحميل الصفحة ليتطبّق التغيير.</p>

  <section class="stats">
    <div class="stat stat--page"><strong id="tab-count">0</strong><span>محجوب في هذه الصفحة</span></div>
    <div class="stat stat--popups"><strong id="popups">0</strong><span>نوافذ إعلانية</span></div>
    <div class="stat stat--redirects"><strong id="redirects">0</strong><span>تحويلات</span></div>
    <div class="stat stat--overlays"><strong id="overlays">0</strong><span>طبقات شفافة</span></div>
  </section>

  <footer>
    <span>نطاقات إعلانية تعلّمها: <strong id="learned">0</strong></span>
    <button id="reset" type="button">مسح</button>
  </footer>

  <a class="credit" href="https://www.linkedin.com/in/walafifi/" target="_blank" rel="noopener">
    <span>تطوير</span>
    <bdi>Waleed A. Afifi</bdi>
    <svg viewBox="0 0 24 24" width="16" height="16" aria-label="LinkedIn">
      <rect width="24" height="24" rx="5" fill="currentColor"/>
      <path fill="#1f1520" d="M6.5 9.5h2.6V18H6.5zM7.8 5.6a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM10.8 9.5h2.5v1.2c.4-.7 1.3-1.4 2.6-1.4 2.7 0 3.2 1.8 3.2 4.1V18h-2.6v-4c0-1 0-2.2-1.4-2.2s-1.6 1-1.6 2.1V18h-2.7z"/>
    </svg>
  </a>

  <script type="module" src="popup.js"></script>
</body>
</html>
